name: "Bug report"
description: Report incorrect or unexpected behaviour in this SGI fork.
body:
- type: markdown
  attributes:
    value: |
      ## Important: Read First

      This repository is a fork of MAME 0.289 for the SGI Indy and Challenge S (see README-SGI.md). Issues are for reproducible problems in this fork, not for support requests or discussion.

      Before reporting an issue:
      * Please check that the problem happens with the latest `sgi-master`.
      * Please search the [existing issues](../issues) first.
      * Problems that also happen in official MAME, or that are in machines this fork doesn't change, belong at [MAME Testers](https://mametesters.org/).
      * Questions about installing or using IRIX are better asked on the [IRIXNet forums](https://forums.irixnet.org/); [sgi.neocities.org](https://sgi.neocities.org/) is a general guide to the SGI machines in MAME.

- type: input
  attributes:
    label: Version
    description: |
      The fork's git commit (`git describe --tags` or `git rev-parse --short HEAD` in your checkout), and how you built it: `mamesgi` (SUBTARGET=sgi) or the full `mame`.
    placeholder: "mame0289-NNN-gxxxxxxxx, mamesgi"
  validations:
    required: true

- type: textarea
  attributes:
    label: System information
    description: Your operating system, CPU architecture, and how MAME was built (native Linux, the Windows cross build, the ARM64 cross build). For video problems, include your GPU, driver version and the MAME video module (e.g. opengl or bgfx). For input problems, include the keyboard/mouse and the MAME input modules. For sound problems, include the sound module (e.g. sdl or portaudio).
    placeholder: |
      Ubuntu 22.04, x86-64, 32 GB RAM, GeForce RTX 3070 driver 535
      mamesgi built with GCC 11, opengl video, sdl sound
  validations:
    required: true

- type: textarea
  attributes:
    label: INI configuration details
    description: Copy your mame.ini here, if you use one.
    placeholder: |
      #
      # CORE CONFIGURATION OPTIONS
      #
      readconfig                1
      writeconfig               0
    render: INI

- type: textarea
  attributes:
    label: Emulated machine and software
    description: |
      The machine short name, IRIX version and disk image (for example the IRIXNet prebuilt IRIX 6.5 CHD, or your own install), and any settings you changed in the Machine Configuration menu (RAM, Ethernet link speed, AES connection). Include the IRIX program involved, if any.
    placeholder: |
      indy_4610, IRIX 6.5.22 (IRIXNet prebuilt CHD), 256 MB RAM, Ethernet Unlimited
      Program: /usr/sbin/apanel
  validations:
    required: true

- type: dropdown
  attributes:
    label: Does it happen in official MAME 0.289?
    description: Official MAME often can't boot IRIX on the same disk image; say so if you couldn't test it.
    options:
      - Not tested
      - "Yes"
      - "No"
      - Couldn't test (official MAME doesn't get far enough)
  validations:
    required: true

- type: textarea
  attributes:
    label: Incorrect behaviour
    description: |
      A concise description of the undesirable behaviour you're experiencing. Be specific – just saying it “doesn’t work” isn’t enough detail.
  validations:
    required: true

- type: textarea
  attributes:
    label: Expected behaviour
    description: |
      A concise description of what you expect should happen. If you have a real Indy or Challenge S, how it behaves there helps a lot.
  validations:
    required: true

- type: textarea
  attributes:
    label: Steps to reproduce
    description: |
      Steps to reproduce the issue, from starting MAME. Save states, and the commands typed in IRIX, help.
    placeholder: |
      1. I started MAME with: ./mamesgi indy_4610 -hard1 irix.chd -window -mouse
      2. In IRIX I ran ...
      3.
      4. I received this error or undesired result.

- type: textarea
  attributes:
    label: Additional details
    description: |
      Anything else relevant: extra disks, CD-ROM or tape images and their SCSI IDs, the network (TAP) setup, the PROM version, MAME's console output or error.log (run with -log).
